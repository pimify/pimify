; Pimify web service (gunicorn). Installed by script/deploy/install.sh —
; __APP_DIR__ / __APP_USER__ are substituted at install time.
[program:pimify-web]
directory=__APP_DIR__
command=__APP_DIR__/.venv/bin/gunicorn core.wsgi:application -c __APP_DIR__/script/gunicorn/gunicorn.conf.py
user=__APP_USER__
# MODE=production selects core.settings.production AND .env.prod
# (see core/settings/env.py). supervisord has no EnvironmentFile,
# so MODE is set here; secrets come from .env.prod via the app.
environment=MODE="production",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pimify-web.log
