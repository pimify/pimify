; Pimify scheduler (monthly backups + scheduled channel feeds). The command
; stays in the foreground until SIGTERM/SIGINT and shuts APScheduler down
; cleanly, so autorestart only fires on real crashes — never on a clean
; shutdown or a deploy stop. stopwaitsecs=30 gives running jobs time to
; finish writing before the TERM escalates.
[program:pimify-scheduler]
directory=__APP_DIR__
command=__APP_DIR__/.venv/bin/python manage.py scheduler
user=__APP_USER__
# MODE=production selects core.settings.production AND .env.prod
# (see core/settings/env.py). supervisord has no EnvironmentFile,
# so MODE is set here; secrets come from .env.prod via the app.
environment=MODE="production",PYTHONUNBUFFERED="1"
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=30
redirect_stderr=true
stdout_logfile=/var/log/supervisor/pimify-scheduler.log
