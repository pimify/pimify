# Pimify nginx site. Installed by script/deploy/install.sh —
# __DOMAIN_HOST__ is substituted at install time.
#
# TLS is YOUR job here (unlike Caddy): point ssl_certificate/_key at real
# certs, e.g. from `certbot --nginx -d __DOMAIN_HOST__`, then reload nginx.
# All traffic is proxied to gunicorn (WhiteNoise serves /static/ and
# /media/ from Django itself, so no alias blocks to get wrong).
# The two proxy_set_header lines are what Django's TRUST_PROXY_HEADERS
# (SECURE_PROXY_SSL_HEADER) reads — without them request.is_secure() is
# False behind the proxy and secure-cookie login silently fails.

server {
    listen 80;
    server_name __DOMAIN_HOST__;
    # Certbot fills this in, or redirect to HTTPS once certs exist.
    # The ACME exception MUST stay: certbot's HTTP-01 challenge is served
    # over plain HTTP, and a blanket redirect breaks renewals (~90 days
    # later the cert expires and the site goes down silently).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name __DOMAIN_HOST__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN_HOST__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN_HOST__/privkey.pem;

    client_max_body_size 50m;  # product image/video uploads

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }
}
